<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#1e232b" />
      <stop offset="65%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#090a0d" />
    </radialGradient>
    
    <!-- Outer Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555e6d" />
      <stop offset="50%" stop-color="#2a303c" />
      <stop offset="100%" stop-color="#14171d" />
    </linearGradient>

    <!-- Lime Glow Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#bbf246" />
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Carbon Fiber pattern -->
    <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#111317" />
      <polygon points="0,0 4,0 0,4" fill="#181c22" />
      <polygon points="4,0 8,4 8,0" fill="#15171d" />
      <polygon points="0,4 4,8 0,8" fill="#15171d" />
      <polygon points="4,4 8,8 8,4" fill="#181c22" />
    </pattern>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle rounded background for native app look -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Instrument Dial Inner Housing -->
  <circle cx="256" cy="256" r="195" fill="url(#carbon)" stroke="#222730" stroke-width="6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#2e3542" stroke-width="2" stroke-dasharray="2 4" />

  <!-- Gauge Arc Track (Background) -->
  <path d="M 126 350 A 155 155 0 1 1 386 350" fill="none" stroke="#252a34" stroke-width="22" stroke-linecap="round" />

  <!-- Gauge Arc Active (Electric Lime Performance Arc) -->
  <path d="M 126 350 A 155 155 0 1 1 330 148" fill="none" stroke="url(#limeGrad)" stroke-width="22" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Speedometer / Mileage Ticks -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="130" y1="340" x2="148" y2="326" />
    <line x1="108" y1="280" x2="130" y2="275" />
    <line x1="110" y1="210" x2="132" y2="218" />
    <line x1="138" y1="150" x2="155" y2="168" />
    <line x1="190" y1="115" x2="198" y2="136" />
    <line x1="256" y1="102" x2="256" y2="125" stroke="#9ae600" stroke-width="4" />
    <line x1="322" y1="115" x2="314" y2="136" stroke="#9ae600" stroke-width="4" />
    <line x1="374" y1="150" x2="357" y2="168" stroke="#9ae600" stroke-width="4" />
    <line x1="402" y1="210" x2="380" y2="218" />
    <line x1="404" y1="280" x2="382" y2="275" />
    <line x1="382" y1="340" x2="364" y2="326" />
  </g>

  <!-- Hunter 350 Crown / Top Accent -->
  <text x="256" y="180" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#94a3b8" letter-spacing="4" text-anchor="middle">HUNTER 350</text>
  <text x="256" y="202" font-family="sans-serif" font-weight="700" font-size="11" fill="#9ae600" letter-spacing="2" text-anchor="middle">GRAPHITE GREY</text>

  <!-- Big Mileage Display (Speedo digital core) -->
  <text x="256" y="280" font-family="'JetBrains Mono', monospace" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle">38.4</text>
  <text x="256" y="312" font-family="sans-serif" font-weight="700" font-size="16" fill="#9ae600" letter-spacing="3" text-anchor="middle">KM / LITRE</text>

  <!-- Lower Odo Pod -->
  <rect x="180" y="342" width="152" height="34" rx="8" fill="#0d0f13" stroke="#2a303c" stroke-width="1.5" />
  <text x="256" y="364" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="15" fill="#f8fafc" letter-spacing="3" text-anchor="middle">005280 km</text>

  <!-- Fuel Pump Icon Badge (Subtle Amber Glow at bottom) -->
  <g transform="translate(236, 396)" filter="url(#amberGlow)">
    <rect x="6" y="4" width="22" height="28" rx="4" fill="none" stroke="url(#amberGrad)" stroke-width="3" />
    <rect x="10" y="8" width="14" height="10" rx="2" fill="url(#amberGrad)" opacity="0.3" />
    <path d="M 28 12 L 33 16 L 33 28 L 30 28" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="17" cy="24" r="2.5" fill="url(#amberGrad)" />
  </g>
</svg>
